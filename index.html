<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9f4e9"><meta name="description" content="Личная открытка с приглашением на свидание 26 ноября в восемь вечера.">
<title>Для тебя · 26 ноября</title>
<style>
@font-face{font-family:Letter;src:url(serif.woff)}@font-face{font-family:Letter;src:url(italic.woff);font-style:italic}
*{box-sizing:border-box}body{margin:0;color:#342f28;background:#f9f5ec;font:16px Arial,sans-serif;--red:#9e322b;--line:#c9bfb0}body:after{position:fixed;inset:0;background:url(grain.png);opacity:.045;content:'';pointer-events:none;z-index:8}.sheet{width:min(1200px,calc(100% - 12vw));margin:auto}header,footer{display:flex;align-items:center;justify-content:space-between}header{padding:25px 0 19px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px;font:italic 27px Letter,Georgia,serif}.heart{font-family:Georgia,serif;color:var(--red)}header .heart{font-size:24px;transform:rotate(-12deg)}.issue,.eyebrow,.detail,footer,.edition{font:11px/1.4 'Courier New',monospace;letter-spacing:.13em;text-transform:uppercase}.issue{color:#665e52}.hero{display:grid;grid-template-columns:1.06fr 1fr;align-items:center;gap:5.6%;padding:clamp(54px,7vh,90px) 0 clamp(60px,8vh,100px);min-height:min(700px,calc(100svh - 140px))}.eyebrow{display:flex;align-items:center;gap:12px;color:var(--red);font-weight:bold}.eyebrow:before{content:'';width:31px;height:1px;background:currentColor}h1{margin:26px 0 18px;font:normal clamp(48px,5.65vw,87px)/.99 Letter,Georgia,serif;letter-spacing:-.055em}h1 span{display:block}h1 em{font-weight:400;color:var(--red)}.message{font:18px/1.48 Letter,Georgia,serif;max-width:365px;margin:24px 0}.when{display:flex;align-items:center;gap:14px;margin:29px 0 27px;flex-wrap:wrap}.detail{display:flex;align-items:center;gap:7px;letter-spacing:.07em;font-size:12px}.sep{width:1px;height:16px;background:var(--line)}.icon{width:17px;height:17px;display:inline-block;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #974c12;outline-offset:5px}.answers{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.yes{border:1px solid var(--red);border-radius:5px;color:#fffaf1;background:var(--red);display:inline-flex;align-items:center;gap:12px;padding:15px 20px;font-size:14px;transition:background .2s,transform .2s}.yes:hover{background:#80281f;transform:translateY(-2px)}.later,.back{background:none;border:0;color:#605347;font-size:13px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#b9a89a;padding:12px 0}.art{position:relative;margin:0 9px 0 4px;isolation:isolate;transform:rotate(2.5deg);background:#fffaec;border:1px solid #d5ccba;padding:13px 13px 0;box-shadow:1px 4px 5px #4b301418,7px 14px 24px #50391c1d}.art:before{content:'';position:absolute;inset:7px -3px -5px 3px;background:#e9dfc9;border:1px solid #d5c8ad;transform:rotate(-4.4deg);z-index:-2}.art:after{position:absolute;content:'';inset:0;z-index:-1;background:#fcf7ea}.print{position:relative;background:#f1e2cf;border:1px solid #c4b39c}.print img{width:100%;display:block;aspect-ratio:1/.97;object-fit:cover;object-position:center 36%}.stamp{position:absolute;top:13px;right:13px;transform:rotate(8deg);width:58px;height:67px;color:#a04d43;background:#f5eddd;mask:radial-gradient(circle at 3px 0,transparent 2px,#000 2.8px) 0 0/7px 100%,radial-gradient(circle at 0 3px,transparent 2px,#000 2.8px) 0 0/100% 7px;mask-composite:intersect;padding:6px}.stamp span{height:100%;border:1px solid currentColor;outline:1px dotted currentColor;outline-offset:-4px;display:grid;place-content:center;font:italic 32px Letter,serif}.caption{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:0 3px;color:#6d564a}.caption i{font:italic 21px Letter,serif}.edition{font-size:10px}.footline{border-top:1px solid var(--line);padding:16px 0 24px;color:#776c5d;font-size:10px}.footline .heart{font-size:17px}.reply{background:#faf4e8;border:1px solid #cbbca8;color:#3d342a;border-radius:7px;box-shadow:0 20px 80px #2c1c2440;max-width:min(410px,90vw);padding:32px}.reply::backdrop{background:#392c2478}.reply h2{font:italic 39px/1.05 Letter,serif;margin:15px 0;color:var(--red)}.reply p{line-height:1.5;font-size:15px}.reply .back{display:block}.reply .status{font-size:13px}.reply textarea{width:100%;font:inherit}.reply [hidden]{display:none}
@media(min-width:1450px){.hero{gap:9%}}
@media(max-width:760px){.sheet{width:calc(100% - 42px);max-width:520px}header{padding:17px 0 14px}.brand{font-size:23px}.issue{font-size:10px}.hero{grid-template-columns:1fr;gap:32px;padding:29px 0 39px}.words{display:contents}.intro{grid-row:1}.art{grid-row:2;width:min(83%,350px);justify-self:center;margin:0}.action{grid-row:3}.print img{aspect-ratio:1/.75;object-position:center 29%}.caption{min-height:37px}.caption i{font-size:17px}.stamp{transform:scale(.8) rotate(8deg);transform-origin:top right}.eyebrow{font-size:10px}h1{font-size:clamp(48px,11.6vw,69px);margin:16px 0 0}h1 span{display:inline}h1 em{display:block}.message{margin:0 0 14px;font-size:18px;max-width:400px}.when{margin:17px 0}.art{padding:9px 9px 0}.answers{gap:16px}.yes{padding:14px 16px}.footline{padding:12px 0}.detail{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="sheet"><header><div class="brand"><span class="heart" aria-hidden="true">♥</span>Для тебя</div><span class="issue">Личная почта</span></header>
<main class="hero"><div class="words"><div class="intro"><div class="eyebrow">Одно приглашение</div><h1><span>Пойдёшь</span> <span>со мной</span> <em>на свидание?</em></h1></div>
<div class="action"><p class="message">Мне хочется провести этот вечер с тобой. Только ты, я и время друг для друга.</p>
<div class="when"><span class="detail"><svg aria-hidden="true" class="icon" viewBox="0 0 20 20"><rect x="3" y="4.5" width="14" height="13" rx="2"/><path d="M6 2.5v4m8-4v4M3 9h14"/></svg><time datetime="2026-11-26">26 ноября, четверг</time></span><span class="sep"></span><span class="detail"><svg aria-hidden="true" class="icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 5v5l3 2"/></svg>20:00</span></div>
<div class="answers"><button class="yes" id="yes"><span aria-hidden="true">♡</span> Да, с удовольствием</button><button class="later" id="later">В другой раз</button></div></div></div>
<figure class="art"><div class="print"><img src="poppies.webp" alt="Ботаническая открытка с тремя алыми маками на кремовой бумаге"><div class="stamp" aria-hidden="true"><span>♥</span></div></div><figcaption class="caption"><i>Маки для тебя</i><span class="edition">26 / XI</span></figcaption></figure></main>
<footer class="footline"><span>26 ноября 2026</span><span class="heart" aria-hidden="true">♡</span><span>С теплом</span></footer></div>
<dialog class="reply" aria-labelledby="replyTitle"><span class="heart" aria-hidden="true">♥</span><h2 id="replyTitle"></h2><p id="replyText"></p><button class="yes" id="share">Поделиться ответом</button><p class="status" role="status"></p><textarea hidden readonly aria-label="Текст ответа"></textarea><button class="back" id="close">Вернуться к открытке</button></dialog>
<script>
const dialog=document.querySelector('dialog'),statusLine=dialog.querySelector('.status'),fallback=dialog.querySelector('textarea');
let answer='';
function choose(yes){
 document.querySelector('#replyTitle').textContent=yes?'До встречи!':'В другой раз';
 document.querySelector('#replyText').textContent=yes?'Четверг, 26 ноября, в восемь вечера. Пришли мне свой ответ, и договоримся, где встретимся.':'Спасибо, что заглянула. Если захочешь, предложи другой день в сообщении.';
 answer=yes?'Да, с удовольствием! Увидимся 26 ноября в 20:00 ♥ Где встретимся?':'Спасибо за приглашение! Давай в другой раз.';
 statusLine.textContent='';fallback.hidden=true;dialog.showModal();
}
document.querySelector('#yes').onclick=()=>choose(true);
document.querySelector('#later').onclick=()=>choose(false);
document.querySelector('#close').onclick=()=>dialog.close();
document.querySelector('#share').onclick=async()=>{
 if(navigator.share){try{await navigator.share({text:answer});return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(answer);statusLine.textContent='Ответ скопирован. Можно вставить его в переписку.'}catch{fallback.hidden=false;fallback.value=answer;fallback.select();statusLine.textContent='Скопируй текст и отправь его в переписке.'}
};
</script></body></html>
